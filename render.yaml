# Blueprint de deploy no Render (plano free).
# Web Service Node. NÃO usa disco persistente: o plano free do Render não o
# suporta, então o SQLite roda no filesystem efêmero — decisão consciente,
# ver seção "Premissas e decisões" no README.
services:
  - type: web
    name: twr-postback-receiver
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: WEBHOOK_SECRET
        sync: false # defina manualmente no dashboard do Render
